<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Captain Commando - Kubo Touch</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #121212; color: #fff; font-family: Arial, sans-serif; }
        header { text-align: center; padding: 15px; background: #1e1e1e; }
        .badge { background: #3498db; color: #fff; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        #game-card { max-width: 500px; margin: 20px auto; background: #1e1e1e; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .cover-container { width: 100%; height: 250px; background-image: url('captaincommando-cover.jpg'); background-size: cover; background-position: center; }
        .content { padding: 20px; }
        h1 { margin: 0 0 10px 0; font-size: 24px; color: #3498db; }
        .meta-info { display: flex; gap: 10px; margin-bottom: 15px; font-size: 13px; color: #aaa; }
        .description { font-size: 14px; line-height: 1.5; color: #ddd; margin-bottom: 15px; }
        .details { font-size: 13px; color: #bbb; margin-bottom: 20px; }
        .details ul { padding-left: 20px; margin: 0; }
        .btn-play { display: block; width: 100%; padding: 12px; background: #2980b9; color: #fff; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; text-align: center; text-decoration: none; }
        .btn-play:hover { background: #1f618d; }
        #game-container { display: none; width: 100%; height: 100vh; }
        #game { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <header>
        <span class="badge">KUBO TOUCH</span>
    </header>

    <div id="game-card">
        <div class="cover-container"></div>
        <div class="content">
            <h1>Captain Commando</h1>
            
            <div class="meta-info">
                <span>🎮 1-4 Jogadores</span>
                <span>📅 1991</span>
                <span>🕹️ Capcom</span>
            </div>

            <p class="description">
                Junte-se ao Capitão Commando e à sua super equipe (Mack the Knife, Ginzu the Ninja e Baby Head) para combater o crime intergaláctico e salvar o universo neste icónico Beat 'Em Up dos Arcades!
            </p>

            <div class="details">
                <ul>
                    <li><strong>🕹️ Gênero:</strong> Ação / Beat 'Em Up (Arcade)</li>
                </ul>
            </div>

            <button class="btn-play" onclick="startEmulator()">JOGAR AGORA</button>
        </div>
    </div>

    <div id="game-container">
        <div id="game"></div>
    </div>

    <script type="text/javascript">
        function startEmulator() {
            // Esconde o card e mostra o contentor do jogo ocupando a tela toda
            document.getElementById('game-card').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';

            // Configurações do EmulatorJS para Arcade (FBNeo)
            window.EJS_player = '#game';
            window.EJS_core = 'fbneo';
            window.EJS_gameName = 'Captain Commando';
            window.EJS_color = '#3498db';
            window.EJS_startOnLoaded = true;
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            window.EJS_gameUrl = 'captaincommando.sfc';
            window.EJS_screenShot = 'captaincommando-cover.jpg';
            
            // Injeta o loader do EmulatorJS com tratamento de erro
            var script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            script.async = true;
            script.onerror = function() {
                alert('Erro ao carregar o motor do emulador. Verifique a sua ligação.');
            };
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
