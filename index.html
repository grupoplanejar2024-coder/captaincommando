<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captain Commando - SNES</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #emulator {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="emulator"></div>
    </div>

    <script type="text/javascript">
        // Configurações do EmulatorJS para Super Nintendo (SNES)
        EJS_player = '#emulator';
        EJS_core = 'snes';
        EJS_gameName = 'Captain Commando';
        
        // Caminhos dos arquivos no seu repositório GitHub Pages
        EJS_gameUrl = 'Captain Commando (U).smc';
        EJS_biosUrl = '';
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        
        // Imagem da capa
        EJS_startOnLoaded = false;
        EJS_backgroundImage = 'Captian Comando.jpg';
    </script>
    
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
